
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no">
  <title>READMIND</title>

  <style>

    /* ESTILOS GENERALES */

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* TARJETA PRINCIPAL */

    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 22px;
      padding: 16px;
      animation: fade .6s ease;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* PORTADA */

    .cover {
      width: 115%;
      max-width: none;
      height: auto;
      border-radius: 18px;
      display: block;
      align-self: center;
    }

    /* BOTONES */

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 18px;
      width: 100%;
    }

    button {
      border: none;
      outline: none;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    button:focus,
    button:focus-visible,
    button:active {
      outline: none;
      box-shadow: none;
    }

    #play {
      width: 200px;
      padding: 14px;
      border-radius: 14px;
      background: #2f80ed;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    /* SECCIÓN CÓDIGO */

    .codigo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    /* CONTENEDOR CIRCULAR */

    .contenedor-circular {
      position: relative;
      width: 240px;
      height: 240px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG CIRCULAR */

    .progreso-circular {
      position: absolute;
      width: 200px;
      height: 200px;
      top: 20px;
      left: 20px;
      overflow: visible;
      pointer-events: none;
    }

    /* SURCO GRIS */

    .progreso-fondo {
      fill: none;
      stroke: #D9D9D9;
      stroke-width: 10;
      stroke-linecap: round;
    }

    /* LÍNEA NARANJA */

    .progreso-linea {
      fill: none;
      stroke: #F5A623;
      stroke-width: 10;
      stroke-linecap: round;

      stroke-dasharray: 100 100;
      stroke-dashoffset: 0;

      transition: stroke-dashoffset 0.08s linear;
    }

    /* CUATRO PUNTOS DE NAVEGACIÓN */

    .punto-audio {
      position: absolute;
      width: 18px;
      height: 18px;
      min-width: 18px;
      min-height: 18px;
      padding: 0;
      border-radius: 50%;
      background: #F5A623;
      z-index: 5;
      transition: none;
      -webkit-tap-highlight-color: transparent;
    }

    .punto-audio:focus,
    .punto-audio:focus-visible,
    .punto-audio:active {
      outline: none;
      box-shadow: none;
      background: #F5A623;
    }

    /* PUNTO SUPERIOR: 0% */

    #puntoInicio {
      top: 21px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* PUNTO IZQUIERDO: 25% */

    #punto25 {
      left: 21px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* PUNTO INFERIOR: 50% */

    #punto50 {
      bottom: 21px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* PUNTO DERECHO: 75% */

    #punto75 {
      right: 21px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* CÍRCULO AZUL */

    .circulo-codigo {
      width: 168px;
      height: 168px;
      border: 22px solid #2f80ed;
      border-radius: 50%;
      box-sizing: border-box;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    /* INTERROGANTE */

    .interrogante-codigo {
      color: #888888;
      font-size: 76px;
      font-weight: 900;
      line-height: 1;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease;
    }

    /* LETRA CENTRAL */

    .letra-codigo {
      color: #F5A623;
      font-size: 76px;
      font-weight: 900;
      line-height: 1;
      opacity: 0;
      visibility: hidden;
      position: absolute;
      transition: opacity 0.3s ease;
    }

    .letra-codigo.visible {
      opacity: 1;
      visibility: visible;
    }

    .interrogante-codigo.oculto {
      opacity: 0;
      visibility: hidden;
    }

    /* BOTÓN VOLVER */

    .boton-volver {
      margin-top: 65px;
      margin-bottom: 12px;
      background: #984d6a;
      color: white;
      width: 136px;
      border-radius: 11px;
      font-size: 16px;
      padding: 13px;
    }

  </style>
</head>

<body>

  <div class="card">

    <!-- PORTADA -->

    <img class="cover" src="CM_portada10.png" alt="Portada">

    <!-- BOTÓN ESCUCHAR -->

    <div class="controls">
      <button id="play" type="button">▶ Escuchar</button>
    </div>

    <!-- AUDIO -->

    <audio id="audio" preload="metadata">
      <source src="CM_audio10.mp3" type="audio/mpeg">
    </audio>

    <!-- SECCIÓN CÓDIGO -->

    <div class="codigo">

      <div class="contenedor-circular">

        <!-- SURCO Y PROGRESO -->

        <svg
          class="progreso-circular"
          viewBox="0 0 200 200"
        >

          <!-- SURCO GRIS PERMANENTE -->

          <path
            class="progreso-fondo"
d="M 100 10
   A 90 90 0 0 1 100 190
   A 90 90 0 0 1 100 10"
            pathLength="100"
          />

          <!-- LÍNEA NARANJA -->

          <path
            class="progreso-linea"
            id="progresoCircular"
d="M 100 10
   A 90 90 0 0 1 100 190
   A 90 90 0 0 1 100 10"
            pathLength="100"
          />

        </svg>

        <!-- CUATRO PUNTOS INTERACTIVOS -->

        <button
          class="punto-audio"
          id="puntoInicio"
          type="button"
          aria-label="Inicio del audio">
        </button>

        <button
          class="punto-audio"
          id="punto25"
          type="button"
          aria-label="25 por ciento del audio">
        </button>

        <button
          class="punto-audio"
          id="punto50"
          type="button"
          aria-label="50 por ciento del audio">
        </button>

        <button
          class="punto-audio"
          id="punto75"
          type="button"
          aria-label="75 por ciento del audio">
        </button>

        <!-- CÍRCULO AZUL -->

        <div class="circulo-codigo">

          <span
            class="interrogante-codigo"
            id="interroganteCodigo">?</span>

          <span
            class="letra-codigo"
            id="letraCodigo">N</span>

        </div>

      </div>

    </div>

    <!-- BOTÓN VOLVER -->

    <button class="boton-volver" id="volver" type="button">
      VOLVER
    </button>

  </div>


  <script>

    // =====================================
    // CONFIGURACIÓN PERSONALIZABLE
    // =====================================

    // Tiempo exacto en que aparece el código

    const TIEMPO_CODIGO = "0:56";

    // Letra que aparece

    const LETRA_CODIGO = "U";

    // COLOR DE LA LÍNEA Y LOS PUNTOS

    const COLOR_PROGRESO = "#F5A623";

// COLOR DE LOS CUATRO PUNTOS
const COLOR_PUNTOS = "#F5A623";

    // COLOR DEL SURCO

    const COLOR_SURCO = "#D9D9D9";

    // GROSOR DE LA LÍNEA NARANJA

    const GROSOR_LINEA = 12;

    // GROSOR DEL SURCO GRIS

    const GROSOR_SURCO = 12;

    // TAMAÑO DEL INTERROGANTE

    const TAMANO_INTERROGANTE = 76;

    // TAMAÑO DE LA LETRA

    const TAMANO_LETRA = 76;

    // COLOR DEL INTERROGANTE

    const COLOR_INTERROGANTE = "#888888";

    // TAMAÑO DE LOS CUATRO PUNTOS

    const TAMANO_PUNTOS = 24;

    // URL DE REGRESO

    const URL_VOLVER = "index.html";


    // =====================================
    // ELEMENTOS
    // =====================================

    const a = document.getElementById('audio');

    const p = document.getElementById('play');

    const letraCodigo =
      document.getElementById('letraCodigo');

    const interroganteCodigo =
      document.getElementById('interroganteCodigo');

    const progresoCircular =
      document.getElementById('progresoCircular');

    const botonVolver =
      document.getElementById('volver');


    // =====================================
    // APLICAR CONFIGURACIÓN VISUAL
    // =====================================

    letraCodigo.textContent = LETRA_CODIGO;

    letraCodigo.style.color = COLOR_PROGRESO;
    letraCodigo.style.fontSize = TAMANO_LETRA + "px";

    interroganteCodigo.style.color = COLOR_INTERROGANTE;

    interroganteCodigo.style.fontSize =
      TAMANO_INTERROGANTE + "px";

    progresoCircular.style.stroke = COLOR_PROGRESO;

progresoCircular.style.strokeWidth = GROSOR_LINEA + "px";

    document.querySelectorAll('.progreso-fondo').forEach(elemento => {

      elemento.style.stroke = COLOR_SURCO;
      elemento.style.strokeWidth = GROSOR_SURCO + "px";

    });

document.querySelectorAll('.punto-audio').forEach(elemento => {

  elemento.style.background = COLOR_PUNTOS;

  elemento.style.width = TAMANO_PUNTOS + "px";
  elemento.style.height = TAMANO_PUNTOS + "px";

  elemento.style.minWidth = TAMANO_PUNTOS + "px";
  elemento.style.minHeight = TAMANO_PUNTOS + "px";

});


    // =====================================
    // CONFIGURAR PROGRESO CIRCULAR
    // =====================================

    const CIRCUNFERENCIA = 100;

    progresoCircular.style.strokeDasharray = "100 100";

    progresoCircular.style.strokeDashoffset = 0;


    // =====================================
    // ACTUALIZAR PROGRESO CIRCULAR
    // =====================================

    function actualizarProgreso() {

      const duracion = a.duration || 0;

      if (!duracion || !isFinite(duracion)) {

        progresoCircular.style.strokeDashoffset = 0;

        return;

      }

      const porcentaje = Math.min(
        Math.max(a.currentTime / duracion, 0),
        1
      );

      // La línea naranja se acorta
      // siguiendo el recorrido de la trayectoria.

      const restante = CIRCUNFERENCIA * porcentaje;

      progresoCircular.style.strokeDashoffset = restante;

    }


    // =====================================
    // MOSTRAR LETRA O INTERROGANTE
    // =====================================

    function actualizarCodigo() {

      const partes = TIEMPO_CODIGO.split(":");

      const segundoCodigo =
        Number(partes[0]) * 60 +
        Number(partes[1]);

      if (a.currentTime >= segundoCodigo) {

        letraCodigo.classList.add('visible');

        interroganteCodigo.classList.add('oculto');

      } else {

        letraCodigo.classList.remove('visible');

        interroganteCodigo.classList.remove('oculto');

      }

    }


    // =====================================
    // ACTUALIZAR INTERFAZ
    // =====================================

    function actualizarInterfaz() {

      actualizarProgreso();

      actualizarCodigo();

    }


    // =====================================
    // NAVEGACIÓN POR LOS CUATRO PUNTOS
    // =====================================

    function irA(porcentaje) {

      if (!isFinite(a.duration) || a.duration <= 0) {

        return;

      }

      // Cambiar posición del audio

      a.currentTime = a.duration * porcentaje;

      // Actualizar línea y código

      actualizarInterfaz();

    }


    // =====================================
    // PUNTO SUPERIOR: INICIO
    // =====================================

    document.getElementById('puntoInicio').onclick = () => {

      irA(0);

    };


    // =====================================
    // PUNTO IZQUIERDO: 25%
    // =====================================

    document.getElementById('punto25').onclick = () => {

      irA(0.25);

    };


    // =====================================
    // PUNTO INFERIOR: 50%
    // =====================================

    document.getElementById('punto50').onclick = () => {

      irA(0.50);

    };


    // =====================================
    // PUNTO DERECHO: 75%
    // =====================================

    document.getElementById('punto75').onclick = () => {

      irA(0.75);

    };


    // =====================================
    // BOTÓN ESCUCHAR / PAUSA
    // =====================================

    p.onclick = () => {

      if (a.paused) {

        a.play();

      } else {

        a.pause();

      }

    };


    a.onplay = () => {

      p.textContent = '⏸ Pausa';

    };

    a.onpause = () => {

      p.textContent = '▶ Escuchar';

    };


    // =====================================
    // ACTUALIZACIÓN DEL AUDIO
    // =====================================

    a.ontimeupdate = () => {

      actualizarInterfaz();

    };

    a.onloadedmetadata = () => {

      actualizarInterfaz();

    };

    a.onseeking = actualizarInterfaz;

    a.onseeked = actualizarInterfaz;


    // =====================================
    // CUANDO TERMINA EL AUDIO
    // =====================================

    a.onended = () => {

      p.textContent = '▶ Escuchar';

      actualizarInterfaz();

    };


    // =====================================
    // BOTÓN VOLVER A SCANNER MIND
    // =====================================

    botonVolver.onclick = () => {

      window.parent.postMessage(
        { type: "READMIND_CLOSE_CONTENT" },
        "*"
      );

    };

  </script>

</body>
</html>
