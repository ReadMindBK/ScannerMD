
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>READMIND</title>

  <style>
    /* ESTILOS GENERALES */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    /* TARJETA PRINCIPAL */
    .card {
      width: 100%;
      max-width: 480px;
      background: white;
      border-radius: 22px;
      padding: 16px;
      animation: fade .6s ease;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    /* PORTADA */
    .cover {
      width: 115%;
      max-width: none;
      height: auto;
      border-radius: 18px;
      display: block;
      align-self: center;
      margin-left: 0;
      margin-right: 0;
    }

    /* BOTÓN ESCUCHAR */
    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
      width: 100%;
    }

    button {
      width: 200px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: #2f80ed;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(.96);
    }

    /* SECCIÓN CÓDIGO */
    .codigo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    /* CONTENEDOR CIRCULAR */
    .contenedor-circular {
      position: relative;
      width: 200px;
      height: 200px;
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG DEL PROGRESO */
    .progreso-circular {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      overflow: visible;
      touch-action: none;
      cursor: pointer;
    }

    /* SURCO GRIS */
    .progreso-fondo {
      fill: none;
      stroke: #D9D9D9;
      stroke-width: 7;
      stroke-linecap: round;
    }

    /* LÍNEA NARANJA */
    .progreso-linea {
      fill: none;
      stroke: #F5A623;
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 565.49;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.08s linear;
      pointer-events: none;
    }

    /* ZONA INVISIBLE PARA TOCAR */
    .zona-interactiva {
      fill: none;
      stroke: transparent;
      stroke-width: 30;
      pointer-events: stroke;
      cursor: pointer;
    }

    /* CÍRCULO AZUL */
    .circulo-codigo {
      width: 168px;
      height: 168px;
      border: 22px solid #2f80ed;
      border-radius: 50%;
      box-sizing: border-box;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      pointer-events: none;
    }

    /* INTERROGANTE */
    .interrogante-codigo {
      color: #888888;
      font-size: 76px;
      font-weight: 900;
      line-height: 1;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease;
    }

    /* LETRA CENTRAL */
    .letra-codigo {
      color: #F5A623;
      font-size: 76px;
      font-weight: 900;
      line-height: 1;
      opacity: 0;
      visibility: hidden;
      position: absolute;
      transition: opacity 0.3s ease;
    }

    .letra-codigo.visible {
      opacity: 1;
      visibility: visible;
    }

    .interrogante-codigo.oculto {
      opacity: 0;
      visibility: hidden;
    }

    /* BOTÓN VOLVER */
    .boton-volver {
      margin-top: 65px;
      margin-bottom: 12px;
      background: #984d6a;
      width: 136px;
      border-radius: 11px;
      font-size: 16px;
      padding: 13px;
    }

  </style>
</head>

<body>

  <div class="card">

    <!-- PORTADA -->
    <img class="cover" src="CM_portada1.png" alt="Portada">

    <!-- BOTÓN ESCUCHAR -->
    <div class="controls">
      <button id="play">▶ Escuchar</button>
    </div>

    <!-- AUDIO -->
    <audio id="audio">
      <source src="CM_audio1.mp3" type="audio/mpeg">
    </audio>

    <!-- SECCIÓN CÓDIGO -->
    <div class="codigo">

      <div class="contenedor-circular">

        <svg
          class="progreso-circular"
          id="controlCircular"
          viewBox="0 0 200 200"
        >

          <!-- SURCO GRIS PERMANENTE -->
          <circle
            class="progreso-fondo"
            cx="100"
            cy="100"
            r="90"
            id="surcoCircular"
          />

          <!-- LÍNEA NARANJA DE PROGRESO -->
          <circle
            class="progreso-linea"
            id="progresoCircular"
            cx="100"
            cy="100"
            r="90"
          />

          <!-- ZONA INVISIBLE INTERACTIVA -->
          <circle
            class="zona-interactiva"
            cx="100"
            cy="100"
            r="90"
          />

        </svg>

        <!-- CÍRCULO AZUL -->
        <div class="circulo-codigo">

          <span
            class="interrogante-codigo"
            id="interroganteCodigo"
          >?</span>

          <span
            class="letra-codigo"
            id="letraCodigo"
          >N</span>

        </div>

      </div>

    </div>

    <!-- BOTÓN VOLVER -->
    <button class="boton-volver" id="volver">
      VOLVER
    </button>

  </div>


  <script>

    // =====================================
    // CONFIGURACIÓN PERSONALIZABLE
    // =====================================

    // Segundo exacto en que aparece el código
    const TIEMPO_CODIGO = "01:44";

    // Letra que aparece
    const LETRA_CODIGO = "N";

    // COLOR DE LA LÍNEA NARANJA
    const COLOR_PROGRESO = "#F5A623";

    // COLOR DEL SURCO INFERIOR
    const COLOR_SURCO = "#D9D9D9";

    // GROSOR DE LA LÍNEA NARANJA
    const GROSOR_LINEA = 15;

    // GROSOR DEL SURCO GRIS
    const GROSOR_SURCO = 12;

    // GROSOR DE LA ZONA TÁCTIL INVISIBLE
    // Cuanto mayor sea, más fácil será tocar el círculo
    const GROSOR_ZONA_TACTIL = 20;

    // TAMAÑO DEL INTERROGANTE
    const TAMANO_INTERROGANTE = 90;

    // TAMAÑO DE LA LETRA
    const TAMANO_LETRA = 76;

    // COLOR DEL INTERROGANTE
    const COLOR_INTERROGANTE = "#888888";

    // URL DE REGRESO
    const URL_VOLVER = "index.html";


    // =====================================
    // ELEMENTOS
    // =====================================

    const a = document.getElementById('audio');
    const p = document.getElementById('play');

    const letraCodigo = document.getElementById('letraCodigo');
    const interroganteCodigo = document.getElementById('interroganteCodigo');

    const progresoCircular = document.getElementById('progresoCircular');
    const surcoCircular = document.getElementById('surcoCircular');

    const controlCircular = document.getElementById('controlCircular');

    const botonVolver = document.getElementById('volver');


    // =====================================
    // APLICAR CONFIGURACIÓN VISUAL
    // =====================================

    letraCodigo.textContent = LETRA_CODIGO;

    letraCodigo.style.color = COLOR_PROGRESO;
    letraCodigo.style.fontSize = TAMANO_LETRA + "px";

    interroganteCodigo.style.color = COLOR_INTERROGANTE;
    interroganteCodigo.style.fontSize = TAMANO_INTERROGANTE + "px";

    progresoCircular.style.stroke = COLOR_PROGRESO;
    progresoCircular.style.strokeWidth = GROSOR_LINEA;

    surcoCircular.style.stroke = COLOR_SURCO;
    surcoCircular.style.strokeWidth = GROSOR_SURCO;

    controlCircular.querySelector('.zona-interactiva')
      .style.strokeWidth = GROSOR_ZONA_TACTIL;


    // =====================================
    // CONFIGURAR CIRCUNFERENCIA
    // =====================================

    const CIRCUNFERENCIA = 2 * Math.PI * 90;

    progresoCircular.style.strokeDasharray = CIRCUNFERENCIA;
    progresoCircular.style.strokeDashoffset = 0;


    // =====================================
    // ACTUALIZAR PROGRESO CIRCULAR
    // =====================================

    function actualizarProgreso() {

      const duracion = a.duration || 0;

      if (!duracion || !isFinite(duracion)) {
        progresoCircular.style.strokeDashoffset = 0;
        return;
      }

      const porcentaje = Math.min(
        Math.max(a.currentTime / duracion, 0),
        1
      );

      // La línea naranja se acorta mientras
      // avanza el audio.

      const restante = CIRCUNFERENCIA * porcentaje;

      progresoCircular.style.strokeDashoffset = restante;

    }


    // =====================================
    // ACTUALIZAR LETRA E INTERROGANTE
    // =====================================

    function actualizarCodigo() {

      const partes = TIEMPO_CODIGO.split(":");

      const segundoCodigo =
        Number(partes[0]) * 60 +
        Number(partes[1]);

      if (a.currentTime >= segundoCodigo) {

        letraCodigo.classList.add('visible');
        interroganteCodigo.classList.add('oculto');

      } else {

        letraCodigo.classList.remove('visible');
        interroganteCodigo.classList.remove('oculto');

      }

    }


    // =====================================
    // ACTUALIZAR TODA LA INTERFAZ
    // =====================================

    function actualizarInterfaz() {

      actualizarProgreso();
      actualizarCodigo();

    }


    // =====================================
    // TOCAR EL CÍRCULO PARA MOVER EL AUDIO
    // =====================================

    function buscarAudioDesdeToque(event) {

      if (!isFinite(a.duration) || a.duration <= 0) {
        return;
      }

      const rect = controlCircular.getBoundingClientRect();

      // Coordenadas del toque respecto al centro
      const x = event.clientX - rect.left - rect.width / 2;
      const y = event.clientY - rect.top - rect.height / 2;

      // Calcular el ángulo
      let angulo = Math.atan2(y, x);

      // Convertir a grados
      let grados = angulo * 180 / Math.PI;

      // El inicio del audio está arriba
      grados = (grados + 90 + 360) % 360;

      // Convertir ángulo a porcentaje
      const porcentaje = grados / 360;

      // Cambiar posición del audio
      a.currentTime = porcentaje * a.duration;

      // Actualizar visualmente
      actualizarInterfaz();

    }


    // =====================================
    // INTERACCIÓN CON LÍNEA Y SURCO
    // =====================================

    let arrastrando = false;

    controlCircular.addEventListener('pointerdown', (event) => {

      arrastrando = true;

      controlCircular.setPointerCapture(event.pointerId);

      buscarAudioDesdeToque(event);

    });

    controlCircular.addEventListener('pointermove', (event) => {

      if (arrastrando) {

        buscarAudioDesdeToque(event);

      }

    });

    controlCircular.addEventListener('pointerup', () => {

      arrastrando = false;

    });

    controlCircular.addEventListener('pointercancel', () => {

      arrastrando = false;

    });


    // =====================================
    // BOTÓN ESCUCHAR / PAUSA
    // =====================================

    p.onclick = () => {

      if (a.paused) {

        a.play();

        p.textContent = '⏸ Pausa';

        p.animate(
          [
            { transform: 'scale(1)' },
            { transform: 'scale(1.08)' },
            { transform: 'scale(1)' }
          ],
          { duration: 250 }
        );

      } else {

        a.pause();

        p.textContent = '▶ Escuchar';

      }

    };


    // =====================================
    // ACTUALIZACIÓN DEL AUDIO
    // =====================================

    a.ontimeupdate = () => {

      actualizarInterfaz();

    };


    a.onloadedmetadata = () => {

      actualizarInterfaz();

    };


    a.onseeking = actualizarInterfaz;
    a.onseeked = actualizarInterfaz;


    // =====================================
    // CUANDO TERMINA EL AUDIO
    // =====================================

    a.onended = () => {

      p.textContent = '▶ Escuchar';

      actualizarInterfaz();

    };


    // =====================================
    // BOTÓN VOLVER A SCANNER MIND
    // =====================================

    botonVolver.onclick = () => {

      window.parent.postMessage(
        { type: "READMIND_CLOSE_CONTENT" },
        "*"
      );

    };

  </script>

</body>
</html>
