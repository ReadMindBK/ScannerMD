<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14253f">
  <meta name="description" content="Escáner interactivo de libros READMIND.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.ico" type="image/x-icon">
  <title>READMIND | Escáner</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="./config.js"></script>
  <style>
    :root { --navy:#14253f; --blue:#244b70; --gold:#e5b95f; --paper:#fbfaf7; --ink:#17243a; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--paper); color:var(--ink); }
    body { min-height:100svh; }
    .app-header { position:relative; z-index:5; height:68px; padding:0 20px; display:flex; align-items:center; justify-content:center; background:var(--navy); color:white; box-shadow:0 3px 16px #101c2b22; }
    .brand { font-size:23px; font-weight:850; letter-spacing:3px; }
    .brand small { display:block; margin-top:1px; text-align:center; color:#cbd7e6; font-size:8px; letter-spacing:2.2px; font-weight:600; }
    main { width:min(100%,620px); margin:0 auto; padding:28px 20px 36px; }
    .eyebrow { text-align:center; color:#987331; font-size:11px; letter-spacing:2px; font-weight:800; }
    h1 { margin:8px 0 8px; text-align:center; font-family:Georgia,serif; font-size:clamp(27px,7vw,38px); color:var(--navy); font-weight:700; }
    .intro { max-width:430px; margin:0 auto 24px; text-align:center; color:#627083; font-size:15px; line-height:1.55; }
    .scan-card { background:white; border:1px solid #e7e4dc; border-radius:24px; padding:18px; box-shadow:0 12px 34px #1d2c4010; }
    .camera-wrap { position:relative; height:min(58svh,470px); min-height:300px; overflow:hidden; border-radius:17px; background:#101b2c; }
    /* Visor de cámara independiente a pantalla completa durante el escaneo. */
    .camera-wrap.scanning {
      position:fixed!important; inset:0!important; z-index:10000!important;
      width:100vw!important; height:100vh!important; height:100dvh!important;
      min-height:0!important; border-radius:0!important; margin:0!important;
      overflow:hidden!important; background:#000!important;
    }
    /* Al reconocer una ilustración, ocultamos por completo la capa de cámara.
       Así la pantalla de resultado y el botón quedan visibles. */
    .camera-wrap.recognized {
      display:none!important;
    }
    .camera-wrap.scanning a-scene {
      position:absolute!important; inset:0!important; width:100%!important;
      height:100%!important; margin:0!important; padding:0!important;
    }
    .camera-wrap.scanning a-scene canvas {
      position:absolute!important; inset:0!important; width:100%!important;
      height:100%!important;
    }
    .camera-wrap.scanning video {
      position:absolute!important; inset:0!important; width:100%!important;
      height:100%!important; object-fit:cover!important;
    }
    .camera-guide { pointer-events:none; position:absolute; z-index:3; inset:0; display:flex; align-items:center; justify-content:center; }
    .frame { width:72%; height:66%; border:2px solid #ffffffcc; border-radius:18px; box-shadow:0 0 0 999px #07111a35; position:relative; }
    .frame:before,.frame:after { content:""; position:absolute; width:26px; height:26px; border-color:var(--gold); border-style:solid; }
    .frame:before { top:-2px; left:-2px; border-width:4px 0 0 4px; border-radius:14px 0 0; }
    .frame:after { bottom:-2px; right:-2px; border-width:0 4px 4px 0; border-radius:0 0 14px; }
    .camera-hint { position:absolute; z-index:4; bottom:17px; left:15px; right:15px; text-align:center; color:white; font-size:13px; text-shadow:0 1px 5px #000; }
    .status { margin:14px 0 0; min-height:22px; text-align:center; color:#667386; font-size:13px; }
    .primary { width:100%; border:0; border-radius:14px; padding:16px 18px; background:var(--navy); color:white; font-weight:800; font-size:14px; letter-spacing:.5px; cursor:pointer; box-shadow:0 6px 15px #14253f22; }
    .primary:disabled { opacity:.55; cursor:wait; }
    .secondary { background:#edf1f5; color:var(--navy); box-shadow:none; margin-top:9px; }
    .result { display:none; margin-top:18px; padding:18px; border:1px solid #e9e2d3; border-radius:19px; background:#fffdf8; }
    .result.show { display:block; animation:rise .35s ease-out; }
    @keyframes rise { from {opacity:0;transform:translateY(8px)} to {opacity:1;transform:translateY(0)} }
    .found-tag { color:#8b692b; font-size:10px; font-weight:850; letter-spacing:1.8px; text-transform:uppercase; }
    .result-row { display:flex; align-items:center; gap:15px; margin:12px 0 15px; }
    .result-image { width:94px; height:112px; object-fit:cover; object-position:top; border-radius:12px; border:1px solid #e4e0d7; background:white; }
    .result h2 { margin:0 0 5px; font-family:Georgia,serif; color:var(--navy); font-size:25px; }
    .book { color:#92703a; font-size:11px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; }
    .description { margin:7px 0 0; color:#637084; font-size:13px; line-height:1.45; }
    .foot { margin:19px 0 0; text-align:center; color:#9aa2ac; font-size:11px; }
    .error { display:none; margin-top:12px; padding:12px; border-radius:12px; background:#fff1ed; color:#8b3327; font-size:13px; line-height:1.45; }
    .error.show { display:block; }
    @media(max-width:390px) { main{padding:22px 14px 28px}.scan-card{padding:12px}.camera-wrap{min-height:280px} }

.a-enter-vr {
  display: none !important;
}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">READMIND<small>EXPLORÁ · DESCUBRÍ · APRENDÉ</small></div>
  </header>

  <main>
    <div class="eyebrow">UNA EXPERIENCIA INTERACTIVA</div>
    <h1>Más para descubrir</h1>
    <p class="intro">Apuntá la cámara a una ilustración del libro.</p>

    <section class="scan-card">
      <div class="camera-wrap" id="cameraWrap">
        <a-scene
          id="arScene"
          mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiScanning: no;"
          color-space="sRGB"
          renderer="colorManagement: true, physicallyCorrectLights"
          vr-mode-ui="enabled: false"
          device-orientation-permission-ui="enabled: false"
          embedded>
          <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
          <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
          <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
        </a-scene>
        <div class="camera-guide" id="guide">
          <div class="frame"></div>
        </div>
        <div class="camera-hint" id="cameraHint">Colocá el dibujo dentro del marco</div>
      </div>

      <p class="status" id="status">Cuando estés listo, activá la cámara.</p>
      <button class="primary" id="startBtn"> <span aria-hidden="true">▣</span> COMENZAR A ESCANEAR</button>
      <button class="primary secondary" id="againBtn" hidden>ESCANEAR OTRO DIBUJO</button>

      <div class="error" id="errorBox" role="alert"></div>

      <section class="result" id="result" aria-live="polite">
        <div class="found-tag">✓ DIBUJO RECONOCIDO</div>
        <div class="result-row">
          <img class="result-image" id="resultImage" alt="">
          <div>
            <h2 id="resultName">Personaje</h2>
            <div class="book" id="resultBook">Libro</div>
            <p class="description" id="resultDescription"></p>
          </div>
        </div>
        <button class="primary" id="openBtn">DESCUBRIR CONTENIDO →</button>
      </section>
    </section>
  </main>

  <script>
    (() => {
      const scene = document.querySelector("#arScene");
      const status = document.querySelector("#status");
      const startBtn = document.querySelector("#startBtn");
      const againBtn = document.querySelector("#againBtn");
      const guide = document.querySelector("#guide");
      const hint = document.querySelector("#cameraHint");
      const result = document.querySelector("#result");
      const errorBox = document.querySelector("#errorBox");
      const openBtn = document.querySelector("#openBtn");
      let selected = null;
      let engineReady = false;
      let sceneLoaded = false;
      let arSystem = null;

      const targets = Array.isArray(window.READMIND_TARGETS) ? window.READMIND_TARGETS : [];
      const showError = (message) => {
        errorBox.textContent = message;
        errorBox.classList.add("show");
        status.textContent = "No pudimos iniciar el escáner.";
        startBtn.disabled = false;
      };

      scene.addEventListener("loaded", () => {
        sceneLoaded = true;
        arSystem = scene.systems["mindar-image-system"] || null;
      });

      // A veces A-Frame termina de cargar antes de que este script registre el evento.
      if (scene.hasLoaded) {
        sceneLoaded = true;
        arSystem = scene.systems["mindar-image-system"] || null;
      }

      scene.addEventListener("arReady", () => {
        engineReady = true;
        status.textContent = "Cámara activa. Buscá una ilustración del libro.";
      });
      scene.addEventListener("arError", () => {
        showError("No se pudo acceder a la cámara. Revisá los permisos del navegador y asegurate de abrir la app mediante HTTPS.");
      });

      function showTarget(index) {
        selected = targets.find(item => Number(item.index) === Number(index));
        if (!selected) {
          status.textContent = "La cámara detectó una imagen, pero falta su configuración en config.js.";
          showError("Se detectó el objetivo " + index + ", pero no existe una entrada con ese índice en config.js.");
          return;
        }
        document.querySelector("#resultName").textContent = selected.name;
        document.querySelector("#resultBook").textContent = selected.book;
        document.querySelector("#resultDescription").textContent = selected.description;
        document.querySelector("#resultImage").src = selected.image;
        document.querySelector("#resultImage").alt = selected.name;
        result.classList.add("show");
        guide.style.display = "none";
        hint.textContent = "¡Ilustración reconocida!";
        status.textContent = "¡Lo encontramos! Ahora descubrí su contenido.";
        startBtn.hidden = true;
        againBtn.hidden = false;

        // La cámara estaba en una capa fija a pantalla completa (z-index alto).
        // La quitamos antes de mostrar el resultado para que no tape la tarjeta.
        const cameraWrap = document.querySelector("#cameraWrap");
        cameraWrap.classList.remove("scanning");
        cameraWrap.classList.add("recognized");

        const system = arSystem || scene.systems["mindar-image-system"];
        if (system) {
          try { system.stop(); } catch (e) { /* La cámara puede haberse detenido ya. */ }
        }
      }

      document.querySelector("#target0").addEventListener("targetFound", () => showTarget(0));
      document.querySelector("#target1").addEventListener("targetFound", () => showTarget(1));

      startBtn.addEventListener("click", async () => {
        errorBox.classList.remove("show");
        result.classList.remove("show");
        selected = null;
        startBtn.disabled = true;
        status.textContent = "Preparando cámara…";
        guide.style.display = "flex";
        hint.textContent = "Colocá el dibujo dentro del marco";
        try {
          if (!targets.length) {
            throw new Error("No se pudo leer config.js. Revisá que el archivo tenga JavaScript válido y que las direcciones URL estén entre comillas.");
          }
          if (!sceneLoaded || !arSystem) {
            await new Promise(resolve => {
              const startedAt = Date.now();
              const waitForScene = () => {
                arSystem = scene.systems["mindar-image-system"];
                if (sceneLoaded && arSystem) return resolve();
                if (Date.now() - startedAt > 8000) return resolve();
                requestAnimationFrame(waitForScene);
              };
              waitForScene();
            });
          }
          if (!arSystem) throw new Error("El motor de escaneo no terminó de cargar. Comprobá tu conexión y recargá la página.");
          status.textContent = "Cargando el archivo de reconocimiento…";
          document.querySelector("#cameraWrap").classList.add("scanning");
          await arSystem.start();
          startBtn.hidden = true;
          startBtn.disabled = false;
          status.textContent = "Cámara activa. Buscá una ilustración del libro.";
        } catch (err) {
          document.querySelector("#cameraWrap").classList.remove("scanning");
          showError(err && err.message ? err.message : "No se pudo iniciar la cámara. Comprobá los permisos y volvé a intentar.");
        }
      });

      againBtn.addEventListener("click", async () => {
        result.classList.remove("show");
        againBtn.hidden = true;
        startBtn.hidden = false;
        startBtn.disabled = false;
        const cameraWrap = document.querySelector("#cameraWrap");
        cameraWrap.classList.remove("recognized");
        cameraWrap.classList.remove("scanning");
        await startBtn.click();
      });

      openBtn.addEventListener("click", () => {
        if (!selected) return;
        if (!selected.url || selected.url.startsWith("REEMPLAZAR_")) {
          showError("Todavía falta configurar la dirección web de este personaje. Editá el campo url en config.js y reemplazalo por la ruta definitiva.");
          return;
        }
        window.location.href = selected.url;
      });

      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
      }
    })();
  </script>
</body>
</html>
