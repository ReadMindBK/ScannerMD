       ========================================================= -->

  <style>
    /* =========================================================
       04. COLORES PRINCIPALES
       Cambiá estos valores para modificar la identidad visual.
       ========================================================= */
    :root {
      --navy: #924863;       /* Azul oscuro: encabezado y botones */
      --blue: #244b70;       /* Azul secundario */
      --gold: #e5b95f;       /* Dorado: detalles del visor */
      --paper: #ffffff;      /* Fondo general */
      --ink: #17243a;        /* Color del texto */
      --muted: #637084;      /* Texto secundario */
      --card: #736E93;       /* Fondo de tarjetas */
      --success: #287b52;    /* Mensajes de reconocimiento */
    }

    /* =========================================================
       05. ESTILOS GENERALES Y TIPOGRAFÍA
       ========================================================= */
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                   "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    body { min-height: 100svh; }

    /* =========================================================
       09. VENTANA DE CÁMARA
       En modo scanning ocupa toda la pantalla del celular.
       La clase recognized la oculta al encontrar una ilustración.
       ========================================================= */
    .camera-wrap {
      position: relative;
      height: min(58svh, 470px);
      min-height: 300px;
      overflow: hidden;
      border-radius: 17px;
      background: #101b2c;
    }
    .camera-wrap.scanning {
      position: fixed !important;
      inset: 0 !important;
      z-index: 10000 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-height: 0 !important;
      border-radius: 0 !important;
      margin: 0 !important;
      overflow: hidden !important;
      background: #000 !important;
    }
    .camera-wrap.recognized { display: none !important; }
    .camera-wrap.scanning a-scene {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .camera-wrap.scanning a-scene canvas,
    .camera-wrap.scanning video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* =========================================================
       10. MARCO VISUAL QUE GUÍA AL USUARIO
       Modificá tamaño, borde y color del rectángulo.
       ========================================================= */
    .camera-guide {
      pointer-events: none;
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame {
      width: 72%;
      height: 50%;
      border: 2px solid #ffffffcc;
      border-radius: 18px;
      box-shadow: 0 0 0 999px #07111a35;
      position: relative;
    }
    .frame:before, .frame:after {
      content: "";
      position: absolute;
      width: 26px;
      height: 26px;
      border-color: var(--gold);
      border-style: solid;
    }
    .frame:before {
      top: -2px; left: -2px;
      border-width: 4px 0 0 4px;
      border-radius: 14px 0 0;
    }
    .frame:after {
      bottom: -2px; right: -2px;
      border-width: 0 4px 4px 0;
      border-radius: 0 0 14px;
    }

    /* =========================================================
       11. MENSAJE SUPERPUESTO EN LA CÁMARA
       ========================================================= */
.camera-hint {
transform: translateY(15px);
  z-index: 4;
  top: 55px;
  bottom: auto;
  left: 15px;
  right: 15px;
  text-align: center;
  color: white;
  font-size: 16px;
  font-weight: 400;
  text-shadow: 0 1px 5px #000;
}

    /* =========================================================
       12. ESTADO DEL ESCÁNER Y BOTONES
       ========================================================= */
    .status {
      margin: 14px 0 0;
      min-height: 22px;
      text-align: center;
      color: #667386;
      font-size: 15px;
      line-height: 1.45;
    }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 18px;
      background: var(--navy);
      color: white;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .5px;
      cursor: pointer;
      box-shadow: 0 6px 15px #14253f22;
    }
    .primary:disabled { opacity: .55; cursor: wait; }
    .secondary {
      background: #edf1f5;
      color: var(--navy);
      box-shadow: none;
      margin-top: 9px;
    }

    /* =========================================================
       13. TARJETA DEL PERSONAJE RECONOCIDO
       ========================================================= */
    .result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border: 1px solid #e9e2d3;
      border-radius: 19px;
      background: #fffdf8;
    }
    .result.show { display: block; animation: rise .35s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .found-tag {
      color: var(--success);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }
    .result-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 12px 0 15px;
    }
    .result-image {
      width: 94px;
      height: 112px;
      object-fit: cover;
      object-position: top;
      border-radius: 12px;
      border: 1px solid #e4e0d7;
      background: white;
    }
    .result h2 {
      margin: 0 0 5px;
      font-family: Georgia, serif;
      color: var(--navy);
      font-size: 25px;
    }
    .book {
      color: #92703a;

      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
    }
    .description {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    /* =========================================================
       31. PERSONALIZAR EL BOTÓN VOLVER
       Modificá estos cuatro valores para cambiar su tamaño:
       - padding: alto y ancho interno del botón.
       - font-size: tamaño del texto.
       - min-width: ancho mínimo del botón.
       ========================================================= */
    .camera-back {
      padding: 15px 42px;   /* ALTO 15px | ANCHO 42px */
      font-size: 20px;      /* TAMAÑO DEL TEXTO */
      min-width: 180px;     /* ANCHO MÍNIMO */
      border-radius: 13px;  /* REDONDEO DE LAS ESQUINAS */
      bottom: 30px; /* SUBE O BAJA EL BOTÓN */
    }

    /* =========================================================
       32. ANIMACIÓN PERMANENTE DEL TÍTULO SCANNER
       Se aplica tanto al encabezado principal como al encabezado
       que aparece durante el escaneo.
       Modificá:
       - 3.2s: duración de cada latido (menos = más rápido).
       - scale(1.045): intensidad del agrandamiento.
       - sombras: intensidad del resplandor.
       ========================================================= */
    .brand-title {
      transform-origin: center center;
      animation: scannerHeartbeat 3.2s ease-in-out infinite;
    }

    @keyframes scannerHeartbeat {
      0%, 100% {
        transform: scale(1);
        text-shadow:
          0 0 3px #fff,
          0 0 7px #fff,
          0 0 1px #fff;
      }
      45% {
        transform: scale(1.045);
        text-shadow:
          0 0 4px #fff,
          0 0 10px #fff,
          0 0 17px #ffffffaa;
      }
      58% {
        transform: scale(1.015);
        text-shadow:
          0 0 4px #fff,
          0 0 9px #fff,
          0 0 12px #ffffff88;
      }
    }

    /* =========================================================
       33. LOGO CIRCULAR DEL LIBRO DURANTE EL ESCANEO
       - width / height: tamaño del círculo.
       - top: distancia desde arriba de la pantalla.
       - border: grosor y color del borde.
       El logo toma automáticamente la imagen del libro elegido.
       ========================================================= */
    .scan-book-logo {
      display: none;
      position: absolute;
      z-index: 5;
      top: 140px;            /* DISTANCIA DESDE ARRIBA */
      left: 50%;
      transform: translateX(-50%);
      width: 100px;          /* ANCHO DEL CÍRCULO */
      height: 100px;         /* ALTO DEL CÍRCULO */
      overflow: hidden;
      border: 4px solid #e5b95f;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 3px 15px #0008;
      pointer-events: none;
    }

    .scan-book-logo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    body.is-scanning .camera-wrap .scan-book-logo {
      display: block;
    }

    /* Mantiene el movimiento sutil también en dispositivos
       que solicitan movimiento reducido, pero con menos efecto. */
    @media (prefers-reduced-motion: reduce) {
      .brand-title {
        animation-duration: 6s;
      }
    }

/* =====================================================
   CONTENEDOR CENTRAL CON IMAGEN DE FONDO EDITABLE
   Para cambiar el tamaño, modificá width o max-width.
   La proporción de la imagen se conserva automáticamente.
   ===================================================== */
.scan-card {
  padding: 0 !important;
  margin: 0 auto !important;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
}
.scan-visual {
  position: relative;
  width: 80%; 
  margin-left: auto;
  margin-right: auto;
  aspect-ratio: 372 / 447;
  background-image: url("./assets/camara-base.png");
  background-position: center;
  background-size: 100% 100%;
  background-repeat: no-repeat;
}
.camera-wrap {
  position: absolute !important;
  left: 10.5% !important;
  top: 20.5% !important;
  width: 78% !important;
  height: 38.5% !important;
  min-height: 0 !important;
  border-radius: 16px !important;
  overflow: hidden;
  background: transparent !important;
}
.camera-wrap:not(.scanning) a-scene { display: none !important; }
.camera-wrap:not(.scanning) .camera-guide { display: none !important; }
.camera-wrap.scanning .camera-guide { display: flex !important; }
.camera-hint {
  position: absolute !important;
  top: 7.3% !important;
  bottom: auto !important;
  left: 7% !important;
  right: 7% !important;
  transform: none !important;
  z-index: 5;
  color: #fff;
  text-align: center;
  font-size: clamp(12px, 3.6vw, 18px);
  line-height: 1.2;
  text-shadow: 0 1px 4px #000;
}
.scan-visual > .status {
  position: absolute;
  top: 75.3%;
  left: 5%;
  width: 90%;
  margin: 0 !important;
  min-height: 0;
  color: #fff !important;
  text-align: center;
  font-size: clamp(12px, 3.6vw, 17px);
  line-height: 1.25;
  z-index: 5;
}
.scan-visual > #startBtn,
.scan-visual > #againBtn {
  position: absolute;
  top: 83.1%;
  left: 5%;
  width: 90%;
  height: 11.8%;
  min-height: 0;
  margin: 0 !important;
  padding: 0 8px !important;
  border: 0;
  border-radius: 12px;
  background: transparent !important;
  color: #fff !important;
  box-shadow: none !important;
  font-size: clamp(12px, 3.8vw, 17px) !important;
  font-weight: 800;
  letter-spacing: .5px;
  z-index: 6;
}
.scan-visual > #againBtn { background: transparent !important; }
.scan-visual [hidden] { display: none !important; }
.scan-card .result { margin-top: 18px; }

/* Durante el escaneo, la cámara vuelve a ocupar toda la pantalla. */
.camera-wrap.scanning {
  position: fixed !important;
  inset: 0 !important;
  z-index: 10000 !important;
  width: 100vw !important;
  height: 100dvh !important;
  min-height: 0 !important;
  border-radius: 0 !important;
  background: #000 !important;
}
.camera-wrap.scanning a-scene { display: block !important; }
.camera-wrap.scanning .camera-guide {
  position: absolute;
  inset: 129px 0 0;
}
body.is-scanning .camera-hint {
  position: fixed !important;
  top: auto !important;
  bottom: 130px !important;
  left: 15px !important;
  right: 15px !important;
  z-index: 10002;
  font-size: 16px;
}
/* ===== POSICIÓN DEL TEXTO BUSCANDO IMAGEN ===== */

:root {
  --distancia-buscando: 15px; /* MODIFICAR DISTANCIA */
}

.camera-wrap.scanning .camera-hint {
  top: auto !important;
  bottom: auto !important;
  transform: none !important;
}



    /* =====================================================
       POSICIÓN DEL MENSAJE "BUSCANDO IMAGEN"
       Cambiá --distancia-buscando para acercar o alejar el texto
       del borde inferior del marco.
       ===================================================== */
    :root {
      --distancia-buscando: 15px;
    }

    .camera-wrap.scanning .camera-guide .frame {
      position: relative;
    }

    .camera-wrap.scanning .camera-guide .frame .camera-hint {
      position: absolute !important;
      top: calc(100% + var(--distancia-buscando)) !important;
      bottom: auto !important;
      left: 50% !important;
      right: auto !important;
      width: calc(100% + 30px);
      transform: translateX(-50%) !important;
      z-index: 10002 !important;
      margin: 0;
      padding: 0;
      color: #fff;
      text-align: center;
      font-size: clamp(12px, 3.6vw, 18px);
      line-height: 1.2;
      text-shadow: 0 1px 4px #000;
      white-space: normal;
    }

  </style>

<body>

</audio>
  <source src="./assets/sonido-libro.mp3" type="audio/mpeg">
</audio>

<audio id="soundError" preload="auto">
  <source src="./assets/sonido-error.mp3" type="audio/mpeg">
</audio>

<audio id="soundScan" preload="auto">
  <source src="./assets/sonido-escanear.mp3" type="audio/mpeg">
</audio>

<audio id="soundSuccess" preload="auto">
  <source src="./assets/sonido-reconocido.mp3" type="audio/mpeg">
</audio>

  <script>
  (() => {
    "use strict";

    /* =========================================================
       18. REFERENCIAS A LOS ELEMENTOS DE LA PÁGINA
       ========================================================= */
    const cameraWrap = document.querySelector("#cameraWrap");
    const status = document.querySelector("#status");
    const startBtn = document.querySelector("#startBtn");
    const againBtn = document.querySelector("#againBtn");
    const guide = document.querySelector("#guide");
    const hint = document.querySelector("#cameraHint");
    const hintHome = hint.parentNode;
    const hintHomeNext = hint.nextSibling;
    const frame = guide.querySelector(".frame");

    // Durante el escaneo, el mensaje se coloca dentro del marco
    // para que su posición dependa del borde inferior real del marco.
    function placeHintBelowFrame() {
      frame.appendChild(hint);
    }

    function restoreHintPosition() {
      hintHome.insertBefore(hint, hintHomeNext);
    }

    const result = document.querySelector("#result");
    const errorBox = document.querySelector("#errorBox");
    const openBtn = document.querySelector("#openBtn");
    const backBtn = document.querySelector("#backBtn");
    const bookOptions = document.querySelector("#bookOptions");
    const scanBookLogo = document.querySelector("#scanBookLogo");
    const scanBookLogoImage = document.querySelector("#scanBookLogoImage");
    const scanBookTitle = document.querySelector("#scanBookTitle");
    const books = Array.isArray(window.READMIND_BOOKS) ? window.READMIND_BOOKS : [];
    let selectedBook = null;

/* ===== SISTEMA DE SONIDOS ===== */

const soundBook = document.querySelector("#soundBook");
const soundError = document.querySelector("#soundError");
const soundScan = document.querySelector("#soundScan");
const soundSuccess = document.querySelector("#soundSuccess");
const soundBack = document.querySelector("#soundBack");
const soundAgain = document.querySelector("#soundAgain");
const soundDiscover = document.querySelector("#soundDiscover");

/* Evita reproducir dos sonidos al escanear otra imagen */
let skipNextScanSound = false;

function playSound(sound) {
  if (!sound) return;

  sound.pause();
  sound.currentTime = 0;

  sound.play().catch(error => {
    console.warn("No se pudo reproducir el sonido:", error);
  });
}

    /* =========================================================
       19. CONFIGURACIÓN LEÍDA DESDE config.js
       READMIND_FILES contiene los nombres de los archivos .mind.
       READMIND_TARGETS contiene los personajes y sus datos.
       ========================================================= */
    const targets = Array.isArray(window.READMIND_TARGETS)
      ? window.READMIND_TARGETS
      : [];

    /* =========================================================
       20. AJUSTES DEL ESCANEO
       groupScanSeconds: segundos que busca en cada archivo antes
       de pasar automáticamente al siguiente.
       ========================================================= */
    // Un único archivo .mind por sesión: nunca rota automáticamente.

    /* =========================================================
       21. VARIABLES DE CONTROL
       ========================================================= */
    let currentGroup = 0;
    let currentScene = null;
    let currentSystem = null;
    let selectedTarget = null;
    let groupTimer = null;
    let scanning = false;
    let recognized = false;
    let cycleToken = 0;

    /* =========================================================
       22. MENSAJES DE ERROR Y LIMPIEZA
       ========================================================= */
function showError(message) {

  playSound(soundError);

  errorBox.textContent = message;
  errorBox.classList.add("show");
  status.textContent = "No pudimos continuar con el escaneo.";
  startBtn.disabled = false;
}

    function clearGroupTimer() {
      if (groupTimer) {
        clearTimeout(groupTimer);
        groupTimer = null;
      }
    }

    async function stopCurrentScene() {
      clearGroupTimer();
      const oldScene = currentScene;
      const oldSystem = currentSystem;
      currentScene = null;
      currentSystem = null;

      if (oldSystem) {
        try { await oldSystem.stop(); } catch (error) {
          console.warn("No se pudo detener el grupo anterior:", error);
        }
      }
      if (oldScene && oldScene.parentNode) {
        oldScene.parentNode.removeChild(oldScene);
      }
    }

    /* =========================================================
       23. CREAR UNA ESCENA PARA UN ARCHIVO .MIND
       Cada archivo tiene su propio conjunto de índices.
       Por ejemplo, targets.mind puede tener 0 y 1;
       targets2.mind también puede empezar en 0.
       ========================================================= */
    function createSceneForFile(fileName, groupNumber) {
      return new Promise((resolve, reject) => {
        const scene = document.createElement("a-scene");
        scene.setAttribute("mindar-image",
          `imageTargetSrc: ./${fileName}; autoStart: false; uiLoading: no; uiScanning: no;`);
        scene.setAttribute("color-space", "sRGB");
        scene.setAttribute("renderer", "colorManagement: true, physicallyCorrectLights");
        scene.setAttribute("vr-mode-ui", "enabled: false");
        scene.setAttribute("device-orientation-permission-ui", "enabled: false");
        scene.setAttribute("embedded", "");

        const camera = document.createElement("a-camera");
        camera.setAttribute("position", "0 0 0");
        camera.setAttribute("look-controls", "enabled: false");
        scene.appendChild(camera);

        // Crear solamente las entidades que pertenecen a este archivo.
        const groupTargets = targets.filter(item => item.file === fileName);
        if (!groupTargets.length) {
          reject(new Error(`No hay personajes configurados para ${fileName} en config.js.`));
          return;
        }

        groupTargets.forEach(item => {
          const entity = document.createElement("a-entity");
          entity.setAttribute("mindar-image-target", `targetIndex: ${Number(item.index)}`);
          entity.addEventListener("targetFound", () => {
            if (recognized || !scanning || currentScene !== scene) return;
            recognizeTarget(item);
          });
          scene.appendChild(entity);
        });

        let settled = false;
        const loadTimeout = setTimeout(() => {
          if (!settled) {
            settled = true;
            reject(new Error(`La escena de ${fileName} tardó demasiado en cargar.`));
          }
        }, 18000);

        scene.addEventListener("loaded", () => {
          if (settled) return;
          const system = scene.systems["mindar-image-system"];
          if (!system) {
            settled = true;
            clearTimeout(loadTimeout);
            reject(new Error(`No se pudo iniciar MindAR para ${fileName}.`));
            return;
          }
          settled = true;
          clearTimeout(loadTimeout);
          resolve({ scene, system });
        }, { once: true });

        cameraWrap.appendChild(scene);
      });
    }

    /* =========================================================
       24. RECONOCIMIENTO DE UN PERSONAJE
       Se detiene el motor, se oculta la cámara y se presenta
       la tarjeta con el botón para abrir la URL configurada.
       ========================================================= */
    async function recognizeTarget(item) {
      playSound(soundSuccess);
      recognized = true;
      scanning = false;
      selectedTarget = item;
      cycleToken++;
      clearGroupTimer();

      document.querySelector("#resultName").textContent = item.name || "Personaje";
      document.querySelector("#resultBook").textContent = item.book || "READMIND";
      document.querySelector("#resultDescription").textContent = item.description || "";
      const image = document.querySelector("#resultImage");
      image.src = item.image || "";
      image.alt = item.name || "Personaje";

      result.classList.add("show");
      guide.style.display = "none";
      hint.textContent = "¡Imagen reconocida!";
      status.textContent = "¡Lo encontramos! Ahora descubrí su contenido.";
      cameraWrap.classList.remove("scanning");
      document.body.classList.remove("is-scanning");
      cameraWrap.classList.add("recognized");
      startBtn.hidden = true;
      againBtn.hidden = false;

      await stopCurrentScene();
    }

    /* =========================================================
       25. PASAR AUTOMÁTICAMENTE AL SIGUIENTE ARCHIVO
       Cuando se agota el tiempo de búsqueda de un grupo, se
       detiene esa escena y se carga el siguiente .mind.
       Al llegar al último, vuelve al primero.
       ========================================================= */
    /* =========================================================
       26. INICIAR UN GRUPO / ARCHIVO .MIND
       ========================================================= */
    async function startGroup(groupIndex, token) {
      if (!scanning || recognized || token !== cycleToken) return;

      const fileName = selectedBook.file;
      status.textContent = "Buscando imagen…";
      hint.textContent = "Buscando imagen";

      try {
        const { scene, system } = await createSceneForFile(fileName, groupIndex);
        if (!scanning || recognized || token !== cycleToken) {
          try { await system.stop(); } catch (e) {}
          if (scene.parentNode) scene.parentNode.removeChild(scene);
          return;
        }

        currentScene = scene;
        currentSystem = system;

        // Esperar a que MindAR confirme que el motor está listo.
        await system.start();

        if (!scanning || recognized || token !== cycleToken) return;

        status.textContent = "Buscando imagen…";
        hint.textContent = "Buscando imagen";
      } catch (error) {
        console.error("Error al cargar", fileName, error);
        if (!scanning || recognized || token !== cycleToken) return;

        status.textContent = `No se pudo cargar ${fileName}. Verificá que el archivo exista.`;
        scanning = false;
        cameraWrap.classList.remove("scanning");
        document.body.classList.remove("is-scanning");
        restoreHintPosition();
        startBtn.hidden = false;
      }
    }

    /* =========================================================
       27. BOTÓN COMENZAR A ESCANEAR
       La cámara se activa únicamente después de tocar este botón,
       requisito de seguridad de los navegadores móviles.
       ========================================================= */
    startBtn.addEventListener("click", async () => {
if (!skipNextScanSound) {
  playSound(soundScan);
}

skipNextScanSound = false;
      errorBox.classList.remove("show");
      result.classList.remove("show");
      selectedTarget = null;
      recognized = false;
      if (!selectedBook) {
        showError("Primero seleccioná un libro");
        return;
      }
      const bookTargets = targets.filter(item => item.file === selectedBook.file);
      if (!bookTargets.length) {
      showError("¡Libro disponible proximamente!");;
        return;
      }
      // Confirmar que el círculo muestre el libro que se va a escanear.
      scanBookLogoImage.src = selectedBook.image || "";
      scanBookLogoImage.alt = selectedBook.name || "Libro";

// Mostrar el nombre del libro debajo del logo.
scanBookTitle.textContent = selectedBook.name || "";

      scanning = true;
      cycleToken++;
      const token = cycleToken;
      startBtn.disabled = true;
      startBtn.hidden = true;
      againBtn.hidden = true;
      guide.style.display = "flex";
      placeHintBelowFrame();
      cameraWrap.classList.remove("recognized");
      cameraWrap.classList.add("scanning");
      document.body.classList.add("is-scanning");
      status.textContent = "Preparando cámara…";
      hint.textContent = "Buscando imagen";
      await startGroup(0, token);
      startBtn.disabled = false;
    });

    books.forEach(book => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "book-option";
      button.setAttribute("aria-label", `Seleccionar libro ${book.name}`);
      button.setAttribute("aria-pressed", "false");
      const image = document.createElement("img");
      image.src = book.image;
      image.alt = book.name;
      button.appendChild(image);
      button.addEventListener("click", () => {
        if (scanning) return;
        selectedBook = book;

        // Actualizar el logo que se mostrará sobre el marco de la cámara.
        scanBookLogoImage.src = book.image || "";
        scanBookLogoImage.alt = book.name || "Libro";
        scanBookTitle.textContent = book.name || "";

        playSound(soundBook);
        bookOptions.querySelectorAll(".book-option").forEach(el => {
          el.classList.remove("selected");
          el.setAttribute("aria-pressed", "false");
        });
        button.classList.add("selected");
        button.setAttribute("aria-pressed", "true");
        errorBox.classList.remove("show");
        status.textContent = `Libro: ${book.name}`;
      });
      bookOptions.appendChild(button);
    });

    backBtn.addEventListener("click", async () => {
      playSound(soundBack);
      scanning = false;
      recognized = false;
      cycleToken++;
      await stopCurrentScene();
      document.body.classList.remove("is-scanning");
      cameraWrap.classList.remove("scanning", "recognized");
      guide.style.display = "flex";
      restoreHintPosition();
      result.classList.remove("show");
      startBtn.hidden = false;
      startBtn.disabled = false;
      againBtn.hidden = true;
      status.textContent = selectedBook ? `Libro: ${selectedBook.name}` : "Seleccioná un libro para comenzar.";
      hint.textContent = "Colocá la imagen dentro del marco";
    });

    /* =========================================================
       28. BOTÓN ESCANEAR OTRA IMAGEN
       Reinicia el ciclo desde el primer archivo .mind.
       ========================================================= */
    againBtn.addEventListener("click", async () => {
      playSound(soundAgain);
      await stopCurrentScene();
      document.body.classList.remove("is-scanning");
      cameraWrap.classList.remove("scanning", "recognized");
      result.classList.remove("show");
      againBtn.hidden = true;
      startBtn.hidden = false;
      startBtn.disabled = false;
skipNextScanSound = true;
startBtn.click();
    });

    /* =========================================================
       29. BOTÓN DESCUBRIR CONTENIDO
       Abre la página web definida en el campo url de config.js.
       ========================================================= */
    openBtn.addEventListener("click", () => {
      if (!selectedTarget) return;
      playSound(soundDiscover);
      const url = selectedTarget.url;
      if (!url || url.startsWith("REEMPLAZAR_")) {
        showError("Todavía falta configurar la dirección web de este personaje. Editá su campo url en config.js.");
        return;
      }
      window.location.href = url;
    });

    /* =========================================================
       30. SERVICE WORKER
       Mantiene la aplicación actualizada. Los archivos .mind se
       consultan desde GitHub Pages y se almacenan tras descargarse.
       ========================================================= */
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error =>
          console.warn("No se pudo registrar el service worker:", error)
        );
      });
    }
  })();

  </script>
<script>
(() => {
  "use strict";

  const overlay = document.querySelector("#installOverlay");
  const message = document.querySelector("#installMessage");
  const installButton = document.querySelector("#installButton");
  const closeButton = document.querySelector("#installClose");

  let deferredPrompt = null;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  const isAndroid = /android/i.test(navigator.userAgent);

  const isInstalled =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  function closeInstall() {
    overlay.classList.remove("show");
  }

  if (isInstalled) return;

  // Detectar cuándo el navegador permite la instalación nativa.
  window.addEventListener("beforeinstallprompt", event => {
    event.preventDefault();
    deferredPrompt = event;

    installButton.textContent = "INSTALAR READMIND";
  });

  // Detectar si la instalación se completó.
  window.addEventListener("appinstalled", () => {
    deferredPrompt = null;
    closeInstall();
  });

  closeButton.addEventListener("click", closeInstall);

  installButton.addEventListener("click", async () => {

    // Android y navegadores compatibles.
    if (deferredPrompt) {
      deferredPrompt.prompt();

      const result = await deferredPrompt.userChoice;

      if (result.outcome === "accepted") {
        closeInstall();
      }

      deferredPrompt = null;
      return;
    }

    // iPhone y iPad.
    if (isIOS) {
      message.textContent =
        "Para instalar READMIND, tocá el botón Compartir de Safari y después elegí «Agregar a pantalla de inicio».";

      installButton.hidden = true;
      return;
    }

    // Android cuando el navegador no ofrece el aviso automático.
    if (isAndroid) {
      message.textContent =
        "Abrí el menú de Chrome (⋮), buscá «Instalar aplicación» o «Agregar a pantalla principal» y confirmá la instalación.";

      installButton.hidden = true;
      return;
    }

    message.textContent =
      "Abrí READMIND desde el navegador de tu celular para instalar la aplicación.";

    installButton.hidden = true;
  });

  // Mostrar la invitación al entrar a la página.
  window.addEventListener("load", () => {
    setTimeout(() => {
      if (!isInstalled) {
        overlay.classList.add("show");
      }
    }, 800);
  });

})();
</script>
